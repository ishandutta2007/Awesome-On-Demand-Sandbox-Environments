<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-width: 1;
    }
    .pulse-orb {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .orbit-node {
      animation: orbitFloat 8s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 80 160;
      animation: streamFlow 5s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 60 120;
      animation: streamFlowRev 6s linear infinite;
    }
    .card-float-1 {
      animation: cardFloat1 5s ease-in-out infinite alternate;
    }
    .card-float-2 {
      animation: cardFloat2 6s ease-in-out infinite alternate;
    }
    .status-pulse {
      animation: beacon 2s infinite ease-out;
    }

    @keyframes streamFlow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -480; }
    }
    @keyframes streamFlowRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 360; }
    }
    @keyframes cardFloat1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes cardFloat2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes beacon {
      0% { r: 4px; opacity: 1; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.65; transform: scale(1.05); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Technical Grid Background -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Background Orbs (Behind content) -->
  <g class="pulse-orb" transform-origin="300 180">
    <circle cx="280" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
    <circle cx="950" cy="170" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Dynamic Data Stream Waves (Behind foreground cards & text) -->
  <g>
    <path d="M -50,280 Q 250,180 550,260 T 1250,190" fill="none" stroke="url(#streamGrad1)" stroke-width="3" class="stream-line" />
    <path d="M -50,120 Q 350,230 750,110 T 1250,220" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" class="stream-line-rev" />
    <path d="M 100,340 C 400,290 800,320 1250,270" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="8 12" />
  </g>

  <!-- Interactive Dynamic Floating Status Cards (Right Side Decorative Graphics) -->
  <g class="card-float-1" transform="translate(860, 52)">
    <rect width="280" height="92" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#334155" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="28" cy="32" r="5" fill="#10b981" />
    <circle cx="28" cy="32" r="9" stroke="#10b981" fill="none" class="status-pulse" />
    <text x="44" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700">Sandbox #PR-1482</text>
    <rect x="204" y="24" width="62" height="20" rx="10" fill="#065f46" />
    <text x="216" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">ACTIVE</text>
    <text x="28" y="68" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Ready in 2.4s • Isolated DB</text>
    <line x1="28" y1="52" x2="252" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <g class="card-float-2" transform="translate(890, 172)">
    <rect width="270" height="84" rx="12" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" filter="url(#cardGlow)" />
    <circle cx="28" cy="30" r="5" fill="#38bdf8" />
    <text x="44" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700">Ephemeral Cluster</text>
    <text x="28" y="62" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">TTL: Auto-teardown on merge</text>
  </g>

  <!-- Foreground Title and Core Content (Always prominent and crisp) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 68)">
      <rect width="270" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#38bdf8" class="tag-text">ON-DEMAND SANDBOX ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" fill="url(#primaryGrad)" class="title-text">Awesome On-Demand</text>
    <text x="0" y="196" fill="#f8fafc" class="title-text">Sandbox Environments</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="244" class="subtitle-text">Curated guide to ephemeral preview environments, isolated testing,</text>
    <text x="0" y="268" class="subtitle-text">and on-demand infrastructure platforms for modern cloud engineering.</text>

    <!-- Key Feature Badges / Highlights -->
    <g transform="translate(0, 296)">
      <rect x="0" y="0" width="138" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">⚡ Ephemeral Previews</text>

      <rect x="148" y="0" width="138" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="162" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">🔒 Zero-Leak Isolation</text>

      <rect x="296" y="0" width="144" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="310" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">🤖 AI Coding Sandboxes</text>
    </g>
  </g>
</svg>
